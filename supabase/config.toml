# Local development/test configuration. Hosted project settings are configured
# separately in the Supabase Dashboard; see docs/guestbook-setup.md.
project_id = "wedding-guestbook"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000/admin/"
additional_redirect_urls = ["http://localhost:3000/admin/", "http://localhost:5173/admin/", "http://127.0.0.1:3000/admin/"]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = true
